name: Update Bomberman contribution graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/bomberman.yml']

concurrency:
  group: bomberman-contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Generate Bomberman SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: 0AndWild
          games: bomberman
      - name: Publish SVGs to a dedicated branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: bomberman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
